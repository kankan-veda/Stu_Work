{% extends 'base.html' %}{% block content %}<section class="card"><h1>{{ title }}</h1><form method="post" enctype="multipart/form-data"><div class="grid"><label>就业时间<input type="date" name="employment_date" value="{{ employment.employment_date or '' }}" required></label><label>就业单位<input name="employer" value="{{ employment.employer or '' }}" required></label><label>单位性质<select name="employer_type" required><option value="">请选择</option>{% for x in ['国有企业','民营企业','事业单位','党政机关','其他'] %}<option {{ 'selected' if employment.employer_type == x }}>{{ x }}</option>{% endfor %}</select></label><label>工作岗位<input name="position" value="{{ employment.position or '' }}"></label><label>档案发往地<input name="archive_destination" value="{{ employment.archive_destination or '' }}" required></label></div><label>就业协议书（仅支持 PDF）<input type="file" name="agreement_file" accept="application/pdf" {{ 'required' if not employment.agreement_data }}></label><label class="check"><input type="checkbox" name="agreement_signed" value="1" required {{ 'checked' if employment.agreement_signed }}> 我确认已签署就业协议</label>{% if employment.agreement_filename %}<p class="hint">当前文件：{{ employment.agreement_filename }}</p>{% endif %}<label>备注<textarea name="remark">{{ employment.remark or '' }}</textarea></label><button>保存并提交审核</button> <a href="{{ url_for('student_dashboard') }}">取消</a></form></section>{% endblock %}
