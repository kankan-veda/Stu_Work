{% extends 'base.html' %}{% block title %}学生注册{% endblock %}{% block content %}<section class="card"><h1>注册学生账号</h1><p class="hint">注册后可登录并录入个人就业信息。</p><form method="post"><div class="grid"><label>登录账号<input name="username" required></label><label>密码<input name="password" type="password" minlength="6" required></label><label>确认密码<input name="confirm_password" type="password" minlength="6" required></label><label>学号<input name="student_no" required></label><label>姓名<input name="name" required></label><label>专业<input name="major" required></label><label>班级<input name="class_name" required></label><label>联系电话<input name="phone" required></label></div><button>注册</button> <a href="{{ url_for('login') }}">返回登录</a></form></section>{% endblock %}
