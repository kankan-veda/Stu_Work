{% extends 'base.html' %}
{% block title %}学生注册 - 就业去向登记系统{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>注册学生账号</h1><p>填写个人资料后即可登录并登记就业信息。</p></div><a class="button secondary" href="{{ url_for('login') }}">返回登录</a></div>
<section class="card"><form method="post"><div class="form-section"><h2>账号信息</h2><p>设置用于登录系统的账号和密码。</p><div class="form-grid"><label>登录账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" minlength="6" autocomplete="new-password" required></label><label>确认密码<input name="confirm_password" type="password" minlength="6" autocomplete="new-password" required></label></div></div><div class="form-section"><h2>个人信息</h2><p>请确保以下信息与学籍资料一致。</p><div class="form-grid"><label>学号<input name="student_no" required></label><label>姓名<input name="name" required></label><label>专业<input name="major" required></label><label>班级<input name="class_name" required></label><label>联系电话<input name="phone" type="tel" required></label></div></div><div class="actions"><button type="submit">完成注册</button><a class="button secondary" href="{{ url_for('login') }}">取消</a></div></form></section>
{% endblock %}
