{% extends 'base.html' %}{% block content %}<h1>就业统计</h1><div class="stats"><div><b>{{ counts.total }}</b><span>记录总数</span></div><div><b>{{ counts.pending }}</b><span>待审核</span></div><div><b>{{ counts.approved }}</b><span>审核通过</span></div><div><b>{{ counts.rejected }}</b><span>已驳回</span></div></div><section class="card"><h2>已通过记录的单位性质</h2><table><tr><th>单位性质</th><th>数量</th></tr>{% for kind,count in employer_type_stats %}<tr><td>{{ kind }}</td><td>{{ count }}</td></tr>{% else %}<tr><td colspan="2">暂无已通过记录</td></tr>{% endfor %}</table></section>{% endblock %}
