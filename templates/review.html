{% extends 'base.html' %}{% block content %}<section class="card"><h1>审核就业信息</h1><p><b>{{ employment.graduate.name }}</b>（{{ employment.graduate.student_no }}）提交于 {{ employment.employment_date }}</p><p>单位：{{ employment.employer }}；岗位：{{ employment.position }}；档案发往：{{ employment.archive_destination }}</p><form method="post"><label>审核意见<textarea name="review_comment">{{ employment.review_comment or '' }}</textarea></label><button name="status" value="approved">审核通过</button> <button name="status" value="rejected" class="danger">驳回</button></form></section>{% endblock %}
