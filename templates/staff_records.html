{% extends 'base.html' %}{% block content %}<div class="section-head"><h1>就业信息审核</h1><a class="button" href="{{ url_for('statistics') }}">查看统计</a></div><section class="card"><form class="filters"><input name="keyword" placeholder="姓名或学号" value="{{ keyword }}"><select name="status"><option value="">全部状态</option><option value="pending" {{ 'selected' if status=='pending' }}>待审核</option><option value="approved" {{ 'selected' if status=='approved' }}>已通过</option><option value="rejected" {{ 'selected' if status=='rejected' }}>已驳回</option></select><button>查询</button></form><table><tr><th>学号</th><th>姓名</th><th>单位</th><th>状态</th><th>操作</th></tr>{% for e in records %}<tr><td>{{ e.graduate.student_no }}</td><td>{{ e.graduate.name }}</td><td>{{ e.employer }}</td><td><span class="badge {{ e.status }}">{{ {'pending':'待审核','approved':'已通过','rejected':'已驳回'}[e.status] }}</span></td><td><a href="{{ url_for('review_employment', employment_id=e.id) }}">审核</a></td></tr>{% else %}<tr><td colspan="5">暂无记录</td></tr>{% endfor %}</table></section>{% endblock %}
